name: build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install SDK packages (use preinstalled SDK)
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_HOME="$SDK" ANDROID_SDK_ROOT="$SDK"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34" "build-tools;35.0.0"

      - name: Set up env (android.jar / build-tools PATH)
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_JAR=$SDK/platforms/android-34/android.jar" >> "$GITHUB_ENV"
          echo "$SDK/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Install Kotlin compiler
        run: |
          curl -sSLo kotlin.zip https://github.com/JetBrains/kotlin/releases/download/v2.1.0/kotlin-compiler-2.1.0.zip
          unzip -q kotlin.zip
          echo "$PWD/kotlinc/bin" >> "$GITHUB_PATH"

      - name: Fetch org.json (unit-test runtime)
        run: curl -sSLo tools/json-20240303.jar https://repo1.maven.org/maven2/org/json/json/20240303/json-20240303.jar

      - name: Unit tests
        run: bash run-tests.sh

      - name: Build APK (ephemeral CI keystore)
        run: |
          keytool -genkeypair -keystore ci.keystore -alias ci -storepass cipass -keypass cipass \
            -dname "CN=sec-apk CI" -keyalg RSA -keysize 2048 -validity 30
          KS="$PWD/ci.keystore" KS_PASS=cipass KS_ALIAS=ci bash build.sh

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: seclab-apk
          path: seclab-*.apk
          if-no-files-found: error
